name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix demo
      - run: npm run build --prefix demo
  browser-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci --prefix demo
      - run: npm run typecheck:browser --prefix demo
      - run: npx playwright install --with-deps chromium
        working-directory: demo
      - run: npm run test:browser --prefix demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filing-agent-demo-browser
          path: |
            demo/playwright-report/
            demo/test-results/
          if-no-files-found: error
          retention-days: 14
